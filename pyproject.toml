[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scope"
version = "0.1.0"
description = "Multi-format and evidence-grounded campus recruitment intelligence RAG"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
embedding = [
  "sentence-transformers>=5,<6",
  "torch>=2.12,<2.13",
  "transformers>=4.51,<6",
]
generation = [
  "openai>=2.6,<3",
]
ocr = [
  "pillow>=11,<13",
  "paddleocr>=3.7,<4",
  "pypdfium2>=5.12,<6",
  "torch>=2.12,<2.13",
  "torchvision>=0.27,<0.28",
  "transformers>=5.10,<6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
